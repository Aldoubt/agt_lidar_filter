sensor_model: mid360

input_topic: /livox/lidar
output_topic: /agt/lidar_filtered

filters:
  # Available plugins:
  # blind_radius
  # cropbox
  # angular_mask
  # voxel

  - type: blind_radius
    enabled: true
    radius: 0.8

  - type: cropbox
    enabled: false
    min_x: -1.2
    max_x: 1.2
    min_y: -1.0
    max_y: 1.0
    min_z: -0.5
    max_z: 0.5

  - type: angular_mask
    enabled: false
    min_pitch: -45.0
    max_pitch: 45.0
